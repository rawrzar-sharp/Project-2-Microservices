<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if item %}Edit Item{% else %}Create New Item{% endif %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; max-width: 600px; }
        h1 { color: #333; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; box-sizing: border-box; }
        textarea { resize: vertical; }
        .btn-group { display: flex; gap: 10px; }
        .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; text-decoration: none; display: inline-block; }
        .btn-save { background-color: #28a745; color: white; }
        .btn-save:hover { background-color: #218838; }
        .btn-cancel { background-color: #6c757d; color: white; }
        .btn-cancel:hover { background-color: #5a6268; }
        .error { color: #dc3545; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>{% if item %}Edit Item{% else %}Create New Item{% endif %}</h1>

    <form method="POST">
        <div class="form-group">
            <label for="short_name">Short Name *</label>
            <input type="text" id="short_name" name="short_name" value="{{ item.short_name if item else '' }}" required>
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description">{{ item.description if item else '' }}</textarea>
        </div>

        <div class="form-group">
            <label for="price">Price (IDR) *</label>
            <input type="number" id="price" name="price" value="{{ item.price if item else '' }}" required>
        </div>

        <div class="form-group">
            <label for="amount">Amount (Stock) *</label>
            <input type="number" id="amount" name="amount" value="{{ item.amount if item else '' }}" required>
        </div>

        <div class="btn-group">
            <button type="submit" class="btn btn-save">{% if item %}Update Item{% else %}Create Item{% endif %}</button>
            <a href="/" class="btn btn-cancel">Cancel</a>
        </div>
    </form>

</body>
</html>
