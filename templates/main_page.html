<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #f4f4f4; }
        .btn { padding: 8px 12px; background-color: #007bff; color: white; text-decoration: none; border-radius: 4px; }
        .btn:hover { background-color: #0056b3; }
        .row-link { cursor: pointer; }
        .row-link:hover { background-color: #f9f9f9; }
    </style>
</head>
<body>

    <h1>Inventory System</h1>
    <a href="/create" class="btn">+ Create New Item</a>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Short Name</th>
                <th>Price (IDR)</th>
                <th>Amount</th>
            </tr>
        </thead>
        <tbody>

            {% for item in items %}
            <tr class="row-link" onclick="window.location.href='/view/{{ item.id }}'">
                <td>{{ item.id }}</td>
                <td>{{ item.short_name }}</td>
                <td>{{ item.price }}</td>
                <td>{{ item.amount }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
